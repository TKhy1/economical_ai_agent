# Keep Gradle's state inside the workspace so the DSH sandbox never blocks it
# (.toolchain/gradle-home is set by android/tools/build.ps1 and gradlew_env).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false
# The DSH sandbox denies Gradle's native file-watcher thread; polling is fine for
# a project this size and avoids the "Couldn't open current thread" noise.
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# This is a side-loaded test build: never let a lint finding fail the build.
android.lint.abortOnError=false

# dl.google.com is unreachable here and the SDK is installed by
# tools/fetch_toolchain.py, so AGP must never try to download SDK components
# (otherwise it stalls for minutes "waiting for package manifests").
android.builder.sdkDownload=false
